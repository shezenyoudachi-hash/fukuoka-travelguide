spring:
  application:
    name: fukuoka-travelguide
  datasource:
    url: jdbc:h2:mem:fukuoka;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none   # スキーマは Flyway が管理する
    open-in-view: false
  flyway:
    enabled: true

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/fukuoka}
    username: ${DATABASE_USER:fukuoka}
    password: ${DATABASE_PASSWORD:fukuoka}
