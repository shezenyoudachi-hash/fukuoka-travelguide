spring:
  application:
    name: fukuoka-travelguide
  datasource:
    url: jdbc:h2:mem:fukuoka;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none   # スキーマは Flyway が管理する
    open-in-view: false
  flyway:
    enabled: true

app:
  anthropic:
    # 未設定ならルールベースで自由記述を解釈する
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${ANTHROPIC_MODEL:claude-haiku-5-5}
    base-url: https://api.anthropic.com
  google:
    # 未設定なら直線距離から移動時間を推定する
    api-key: ${GOOGLE_MAPS_API_KEY:}
    routes-url: https://routes.googleapis.com/directions/v2:computeRoutes

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/fukuoka}
    username: ${DATABASE_USER:fukuoka}
    password: ${DATABASE_PASSWORD:fukuoka}
